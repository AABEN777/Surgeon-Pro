name: Analyze

# Paste a contract address and get back exactly what Surgeon computes for it
# and which gate decides its fate.
on:
  workflow_dispatch:
    inputs:
      address:
        description: "Contract address"
        required: true
        type: string
      send:
        description: "Also send the readout to Telegram"
        required: false
        default: true
        type: boolean

  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: surgeon-pro-analyze
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.SURGEON_PRO_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:   ${{ secrets.SURGEON_PRO_CHAT_ID }}
      SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY:       ${{ secrets.SUPABASE_KEY }}
      HELIUS_API_KEY:     ${{ secrets.HELIUS_API_KEY }}
      PYTHONUNBUFFERED:   "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Analyze address
        if: github.event_name == 'workflow_dispatch'
        run: |
          python3 analyze.py "${{ inputs.address }}" \
            ${{ inputs.send && '--send' || '' }}

      - name: Answer addresses sent to the bot
        if: github.event_name == 'schedule'
        run: python3 analyze.py --poll
